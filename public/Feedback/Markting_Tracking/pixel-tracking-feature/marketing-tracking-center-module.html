<!--
=====================================================================
MARKETING & TRACKING CENTER — EMBEDDABLE MODULE
=====================================================================
طريقة الدمج في أي داشبورد أدمن عندك (3 خطوات):

1) انسخ كل الملف ده وحطه كـ partial/section جوه صفحة "Marketing" في الأدمن بتاعك
   (Blade / EJS / React dangerouslySetInnerHTML / iframe — أي حاجة).

2) الموديول بيشتغل جوه أي حاوية عندها id="mtc-root". لو مفيش حاوية بالاسم ده،
   بيعمل واحدة تلقائيًا جوه body. مفيش أي conflict مع CSS بتاع الأدمن لأن
   كل الأنماط معمولة scoped جوه ".mtc-scope" وكل متغيرات الألوان معرّفة
   محليًا جوه نفس الكلاس مش على :root.

3) لتشغيله برمجيًا من جافاسكربت الأدمن نفسه:
     MarketingTrackingCenter.mount('#your-container-id');

الموديول بيحفظ حالته في localStorage تحت مفتاح 'mtc_state' — لو عندك أكتر
من عميل/تينانت في نفس الأدمن، غيّر المفتاح ده لكل تينانت (شرح تحت في نهاية
الملف تحت "متعدد العملاء / Multi-Tenant").

كل التكامل الحقيقي مع Meta/Google (OAuth الفعلي) محتاج Backend — الجزء ده
موضّح بالتفصيل جوه تبويب "إعدادات متقدمة" داخل الموديول نفسه.
=====================================================================
-->

.mtc-scope{
  --mtc-bg-0:#0d0a14; --mtc-bg-1:#150f22; --mtc-panel-solid:#1a1329;
  --mtc-border:#33254f; --mtc-border-soft:#2a1e42;
  --mtc-violet:#7c3aed; --mtc-violet-soft:#a78bfa;
  --mtc-grad: linear-gradient(135deg,#7c3aed 0%,#8a1f4b 100%);
  --mtc-green:#22c55e; --mtc-yellow:#eab308; --mtc-red:#ef4444;
  --mtc-text-0:#f4f1fb; --mtc-text-1:#c9c1e0; --mtc-text-2:#8d81ab;
  --mtc-mono:'JetBrains Mono','Consolas',monospace;

  all:initial;
  * { box-sizing:border-box; }
  display:block;
  font-family:'Tahoma','Segoe UI',system-ui,sans-serif;
  direction:rtl;
  color:var(--mtc-text-0);
  background:
    radial-gradient(circle at 15% 0%, #3a1a5c33 0%, transparent 45%),
    radial-gradient(circle at 85% 10%, #6b103f33 0%, transparent 45%),
    var(--mtc-bg-0);
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--mtc-border-soft);
  isolation:isolate;
}
.mtc-scope *{box-sizing:border-box;}
.mtc-scope ::-webkit-scrollbar{width:8px;height:8px;}
.mtc-scope ::-webkit-scrollbar-thumb{background:var(--mtc-border);border-radius:8px;}

  /* ==========================================================
     MOUNT FUNCTION — ده اللي بيستدعيه داشبورد الأدمن
  ========================================================== */
  function mount(selectorOrEl, opts){
    opts = opts || {};
    let root = typeof selectorOrEl === 'string' ? document.querySelector(selectorOrEl) : selectorOrEl;
    if(!root){ root = document.createElement('div'); document.body.appendChild(root); }
    root.innerHTML = TEMPLATE;

    // ---- namespaced state (multi-tenant support via opts.storageKey) ----
    const STORAGE_KEY = opts.storageKey || 'mtc_state';
    const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {
      meta:{connected:false,business:null,page:null,pixel:null},
      google:{connected:false,property:null},
      advancedMode:false, customEvents:[]
    };
    function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    const q  = (sel)=>root.querySelector(sel);
    const qa = (sel)=>root.querySelectorAll(sel);

    /* ---- tabs ---- */
    qa('[data-mtc-tab]').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        qa('[data-mtc-tab]').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const v = tab.getAttribute('data-mtc-tab');
        qa('[data-mtc-view]').forEach(el=>el.classList.remove('active'));
        q('[data-mtc-view="'+v+'"]').classList.add('active');
      });
    });

    /* ---- advanced mode ---- */
    q('[data-mtc-adv-toggle]').addEventListener('click', ()=>{
      state.advancedMode = !state.advancedMode; save(); applyAdvancedMode();
    });
    function applyAdvancedMode(){
      q('[data-mtc-adv-switch]').classList.toggle('on', state.advancedMode);
      q('[data-mtc-adv-locked]').style.display = state.advancedMode ? 'none' : 'flex';
      qa('[data-mtc-manual-pixel],[data-mtc-manual-ga4]').forEach(el=>el.disabled = !state.advancedMode);
      if(state.advancedMode){
        q('[data-mtc-manual-pixel]').value = state.meta.pixel ? state.meta.pixel.id : '';
        q('[data-mtc-manual-ga4]').value = state.google.property ? state.google.property.measurementId : '';
      }
    }

    q('[data-mtc-refresh]').addEventListener('click', ()=>renderRealtime(true));

    /* ---- wizard ---- */
    const metaBusinesses = ['UpKlick Business Manager','Mohamed Joe Coaching BM','Personal Brand OS Ads'];
    const metaPages = ['UpKlick | Official Page','Mohamed Joe','Personal Brand OS'];
    const metaPixels = [{id:'812934710239481',name:'UpKlick Main Pixel'},{id:'129384710293841',name:'Coaching Funnel Pixel'}];
    const googleAccounts = ['Mohamed Joe — Google Account'];
    const googleProperties = [
      {name:'UpKlick — Web', measurementId:'G-K3P9XQ21LM'},
      {name:'Personal Brand OS', measurementId:'G-7HN4Z8YB03'},
      {name:'CoachOS Landing', measurementId:'G-4RT1WP66QD'}
    ];
    let wiz = {provider:null, step:0, picks:{}};

    qa('[data-mtc-open-wizard]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const provider = btn.getAttribute('data-mtc-open-wizard');
        wiz = {provider, step:0, picks:{}};
        q('[data-mtc-overlay]').classList.add('active');
        const logo = q('[data-mtc-wizard-logo]');
        logo.className = 'mtc-integ-logo ' + (provider==='meta' ? 'mtc-logo-meta' : 'mtc-logo-google');
        logo.textContent = provider==='meta' ? 'f' : 'G';
        q('[data-mtc-wizard-title]').textContent = provider==='meta' ? 'ربط Meta' : 'ربط Google';
        renderWizardStep();
      });
    });
    q('[data-mtc-close-wizard]').addEventListener('click', ()=>q('[data-mtc-overlay]').classList.remove('active'));

    function renderSteps(total, current){
      const row = q('[data-mtc-steps-row]'); row.innerHTML='';
      for(let i=0;i<total;i++){
        const d = document.createElement('div');
        d.className = 'mtc-step-dot' + (i<=current ? ' done' : '');
        row.appendChild(d);
      }
    }

    function renderWizardStep(){
      const body = q('[data-mtc-wizard-body]');
      if(wiz.provider === 'meta'){
        renderSteps(4, wiz.step);
        if(wiz.step===0){
          body.innerHTML = `<div class="mtc-spinner"></div><div class="mtc-center-text">جاري تسجيل الدخول وطلب الأذونات من Meta...</div>`;
          setTimeout(()=>{ wiz.step=1; renderWizardStep(); }, 1000);
        } else if(wiz.step===1){
          body.innerHTML = `<div style="font-size:12.5px;margin-bottom:9px;">اختَر Business Manager</div><div class="mtc-option-list">${metaBusinesses.map(b=>`<div class="mtc-option-item" data-pick-business="${b}"><span>🏢 ${b}</span><span>›</span></div>`).join('')}</div>`;
          qa('[data-pick-business]').forEach(el=>el.addEventListener('click',()=>{wiz.picks.business=el.getAttribute('data-pick-business'); wiz.step=2; renderWizardStep();}));
        } else if(wiz.step===2){
          body.innerHTML = `<div style="font-size:12.5px;margin-bottom:9px;">اختَر الصفحة</div><div class="mtc-option-list">${metaPages.map(p=>`<div class="mtc-option-item" data-pick-page="${p}"><span>📄 ${p}</span><span>›</span></div>`).join('')}</div>`;
          qa('[data-pick-page]').forEach(el=>el.addEventListener('click',()=>{wiz.picks.page=el.getAttribute('data-pick-page'); wiz.step=3; renderWizardStep();}));
        } else if(wiz.step===3){
          body.innerHTML = `<div style="font-size:12.5px;margin-bottom:9px;">اختَر البيكسل</div><div class="mtc-option-list">${metaPixels.map((p,i)=>`<div class="mtc-option-item" data-pick-pixel="${i}"><span>🎯 ${p.name}</span><span>›</span></div>`).join('')}</div>`;
          qa('[data-pick-pixel]').forEach(el=>el.addEventListener('click',()=>{
            const pixel = metaPixels[+el.getAttribute('data-pick-pixel')];
            body.innerHTML = `<div class="mtc-spinner"></div><div class="mtc-center-text">جاري الحفظ والتحقق...</div>`;
            setTimeout(()=>{
              state.meta = {connected:true, business:wiz.picks.business, page:wiz.picks.page, pixel};
              save();
              body.innerHTML = `<div class="mtc-success-tick">✓</div><div class="mtc-center-text" style="color:#fff;font-size:13.5px;font-weight:700;">تم ربط Meta بنجاح!</div><div class="mtc-center-text">Pixel "${pixel.name}" جاهز</div><div style="text-align:center;margin-top:16px;"><button class="mtc-btn mtc-btn-primary" data-close-ok>تمام</button></div>`;
              pushDebug('POST','/graph/v19/pixel/connect','200 OK');
              q('[data-close-ok]').addEventListener('click', ()=>{ q('[data-mtc-overlay]').classList.remove('active'); refreshAll(); });
            }, 1100);
          }));
        }
      } else {
        renderSteps(3, wiz.step);
        if(wiz.step===0){
          body.innerHTML = `<div class="mtc-spinner"></div><div class="mtc-center-text">جاري تسجيل الدخول بحساب Google...</div>`;
          setTimeout(()=>{ wiz.step=1; renderWizardStep(); }, 1000);
        } else if(wiz.step===1){
          body.innerHTML = `<div style="font-size:12.5px;margin-bottom:9px;">اختَر الحساب</div><div class="mtc-option-list">${googleAccounts.map(a=>`<div class="mtc-option-item" data-pick-acc="${a}"><span>👤 ${a}</span><span>›</span></div>`).join('')}</div>`;
          qa('[data-pick-acc]').forEach(el=>el.addEventListener('click',()=>{wiz.step=2; renderWizardStep();}));
        } else if(wiz.step===2){
          body.innerHTML = `<div style="font-size:12.5px;margin-bottom:9px;">اختَر GA4 Property</div><div class="mtc-option-list">${googleProperties.map((p,i)=>`<div class="mtc-option-item" data-pick-prop="${i}"><span>📈 ${p.name}</span><span>›</span></div>`).join('')}</div>`;
          qa('[data-pick-prop]').forEach(el=>el.addEventListener('click',()=>{
            const prop = googleProperties[+el.getAttribute('data-pick-prop')];
            body.innerHTML = `<div class="mtc-spinner"></div><div class="mtc-center-text">جاري ربط GA4 وGTM...</div>`;
            setTimeout(()=>{
              state.google = {connected:true, property:prop};
              save();
              body.innerHTML = `<div class="mtc-success-tick">✓</div><div class="mtc-center-text" style="color:#fff;font-size:13.5px;font-weight:700;">تم ربط Google بنجاح!</div><div class="mtc-center-text">Property "${prop.name}" جاهز</div><div style="text-align:center;margin-top:16px;"><button class="mtc-btn mtc-btn-primary" data-close-ok>تمام</button></div>`;
              pushDebug('POST','/analytics/v1/property/connect','200 OK');
              q('[data-close-ok]').addEventListener('click', ()=>{ q('[data-mtc-overlay]').classList.remove('active'); refreshAll(); });
            }, 1100);
          }));
        }
      }
    }

    /* ---- overview / integrations render ---- */
    function refreshAll(){
      const metaC = state.meta.connected, googleC = state.google.connected;
      q('[data-mtc-dot-meta]').className = 'mtc-dot ' + (metaC?'mtc-dot-green':'mtc-dot-red');
      q('[data-mtc-dot-google]').className = 'mtc-dot ' + (googleC?'mtc-dot-green':'mtc-dot-red');
      q('[data-mtc-meta-status]').textContent = metaC ? 'متصل' : 'غير متصل';
      q('[data-mtc-google-status]').textContent = googleC ? 'متصل' : 'غير متصل';
      q('[data-mtc-pixel]').textContent = metaC ? state.meta.pixel.name : '—';
      q('[data-mtc-ga4]').textContent = googleC ? 'نشط ✓' : '—';

      q('[data-mtc-meta-connected]').style.display = metaC ? 'block':'none';
      q('[data-mtc-meta-empty]').style.display = metaC ? 'none':'block';
      q('[data-mtc-open-wizard="meta"]').textContent = metaC ? 'إعادة المزامنة' : 'ربط Meta';
      q('[data-mtc-google-connected]').style.display = googleC ? 'block':'none';
      q('[data-mtc-google-empty]').style.display = googleC ? 'none':'block';
      q('[data-mtc-open-wizard="google"]').textContent = googleC ? 'إعادة المزامنة' : 'ربط Google';
      if(metaC){
        q('[data-mtc-meta-bm]').textContent = state.meta.business;
        q('[data-mtc-meta-page]').textContent = state.meta.page;
        q('[data-mtc-meta-pixel-id]').textContent = state.meta.pixel.id;
        q('[data-mtc-meta-sync]').textContent = 'آخر مزامنة: الآن';
      }
      if(googleC){
        q('[data-mtc-google-property]').textContent = state.google.property.name + ' (' + state.google.property.measurementId + ')';
        q('[data-mtc-google-sync]').textContent = 'آخر مزامنة: الآن';
      }

      let checklist = [metaC,googleC,metaC,googleC,googleC,metaC,true,true,false,metaC||googleC,metaC||googleC,metaC||googleC,metaC||googleC,metaC||googleC,false,true];
      let done = checklist.filter(Boolean).length;
      let pct = Math.round(done/checklist.length*100);
      q('[data-mtc-readiness]').textContent = pct+'%';
      q('[data-mtc-readiness-hint]').textContent = done+' من '+checklist.length+' عنصر';

      const badge = q('[data-mtc-badge-integ]');
      const missing = (metaC?0:1)+(googleC?0:1);
      badge.style.display = missing===0 ? 'none':'inline-block';
      badge.textContent = missing;

      renderHealth(); renderFunnel(); renderAI(); renderMapping();
    }

    /* ---- top events ---- */
    const eventNames = ['Page View','Lead','Purchase','Add To Cart','Complete Registration','Book Meeting','Generate AI','Login'];
    function renderTopEvents(){
      const tbody = q('[data-mtc-top-events] tbody'); tbody.innerHTML='';
      eventNames.slice(0,5).forEach(name=>{
        const count = Math.floor(Math.random()*900)+40;
        const rate = (Math.random()*6+1).toFixed(1);
        tbody.innerHTML += `<tr><td>${name}</td><td>${count}</td><td>${rate}%</td></tr>`;
      });
      q('[data-mtc-events-today]').textContent = (Math.floor(Math.random()*4000)+800).toLocaleString();
      q('[data-mtc-visitors]').textContent = Math.floor(Math.random()*140)+5;
    }

    /* ---- mapping ---- */
    const mappings = [
      {std:'Purchase', targets:['Meta: Purchase','GA4: purchase','DB: purchase']},
      {std:'Lead', targets:['Meta: Lead','GA4: generate_lead']},
      {std:'Complete Registration', targets:['Meta: CompleteRegistration','GA4: sign_up']},
      {std:'Book Meeting', targets:['Meta: Schedule','GA4: book_meeting']},
      {std:'Add To Cart', targets:['Meta: AddToCart','GA4: add_to_cart']},
      {std:'Initiate Checkout', targets:['Meta: InitiateCheckout','GA4: begin_checkout']},
    ];
    function renderMapping(){
      q('[data-mtc-mapping-grid]').innerHTML = mappings.map(m=>`
        <div class="mtc-card"><div class="mtc-card-label">حدث موحّد</div><div style="font-weight:700;font-size:13px;margin:5px 0 9px;">${m.std}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;">${m.targets.map(t=>`<span class="mtc-tag">${t}</span>`).join('')}</div></div>`).join('');
    }

    /* ---- library ---- */
    const libraryEvents = ['Page View','View Content','Lead','Contact','Purchase','Add To Cart','Initiate Checkout','Book Meeting','Complete Registration','Login','Logout','Generate AI','Upload File','Download File','Export PDF','Invite Member','Upgrade Plan','Cancel Subscription','Payment Success','Payment Failed','Project Created','Project Deleted','Subscription Started','Subscription Renewed','Subscription Cancelled'];
    function renderLibrary(){
      const all = [...libraryEvents, ...state.customEvents];
      q('[data-mtc-library-grid]').innerHTML = all.map(e=>`<div class="mtc-event-chip"><span>🎯 ${e}</span><span class="mtc-pill mtc-pill-violet">Standard</span></div>`).join('');
    }
    q('[data-mtc-lib-search]').addEventListener('input', (e)=>{
      const val = e.target.value.trim().toLowerCase();
      qa('[data-mtc-library-grid] .mtc-event-chip').forEach(el=>{ el.style.display = el.textContent.toLowerCase().includes(val)?'flex':'none'; });
    });
    q('[data-mtc-add-event]').addEventListener('click', ()=>{
      const name = prompt('اسم الحدث المخصص (بالإنجليزي):');
      if(!name) return;
      state.customEvents.push(name); save(); renderLibrary();
    });

    /* ---- realtime ---- */
    const countries = ['🇪🇬 مصر','🇸🇦 السعودية','🇦🇪 الإمارات','🇳🇱 هولندا','🇰🇼 الكويت','🇯🇴 الأردن','🇲🇦 المغرب'];
    const platforms = ['Meta','GA4','Server DB'];
    const campaigns = ['ramadan_launch','ai_creators_q3','coach_upsell','retargeting_ar','brand_os_beta','—'];
    let rtData = [];
    function genRt(){
      return {time:new Date().toLocaleTimeString('ar-EG',{hour12:false}), user:'user_'+Math.floor(Math.random()*9000+1000),
        event:eventNames[Math.floor(Math.random()*eventNames.length)], platform:platforms[Math.floor(Math.random()*platforms.length)],
        country:countries[Math.floor(Math.random()*countries.length)], utm:campaigns[Math.floor(Math.random()*campaigns.length)],
        status: Math.random()>0.08 ? 'success':'failed'};
    }
    function renderRealtime(reset){
      if(reset) rtData = [];
      for(let i=0;i<3;i++) rtData.unshift(genRt());
      rtData = rtData.slice(0,80);
      const term = (q('[data-mtc-rt-search]').value||'').toLowerCase();
      const filtered = rtData.filter(r=> !term || r.event.toLowerCase().includes(term) || r.country.toLowerCase().includes(term));
      q('[data-mtc-rt-table]').innerHTML = filtered.slice(0,40).map(r=>`
        <tr><td style="font-family:var(--mtc-mono);font-size:10.5px;">${r.time}</td><td>${r.user}</td><td>${r.event}</td>
        <td><span class="mtc-pill mtc-pill-violet">${r.platform}</span></td><td>${r.country}</td><td>${r.utm}</td>
        <td>${r.status==='success' ? '<span class="mtc-pill mtc-pill-green">نجح</span>' : '<span class="mtc-pill mtc-pill-red">فشل</span>'}</td></tr>`).join('');
      renderTopEvents();
    }
    q('[data-mtc-rt-search]').addEventListener('input', ()=>renderRealtime(false));
    q('[data-mtc-export-csv]').addEventListener('click', ()=>{
      const rows = [['Time','User','Event','Platform','Country','UTM','Status'], ...rtData.map(r=>[r.time,r.user,r.event,r.platform,r.country,r.utm,r.status])];
      const csv = rows.map(r=>r.join(',')).join('\n');
      const blob = new Blob([csv],{type:'text/csv'});
      const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='realtime-events.csv'; a.click();
    });

    /* ---- funnel ---- */
    function renderFunnel(){
      const steps = [{label:'Landing Page',val:100},{label:'Signup',val:62},{label:'Dashboard',val:54},{label:'AI Usage',val:41},{label:'Purchase',val:19},{label:'Subscription',val:15},{label:'Upsell',val:6}];
      q('[data-mtc-funnel-card]').innerHTML = steps.map((s,i)=>{
        const drop = i===0 ? '' : `-${(steps[i-1].val - s.val)}%`;
        return `<div class="mtc-funnel-step"><div class="mtc-funnel-label">${s.label}</div><div class="mtc-funnel-bar-wrap"><div class="mtc-funnel-bar" style="width:${s.val}%">${s.val}%</div></div><div class="mtc-funnel-drop">${drop}</div></div>`;
      }).join('');
    }

    /* ---- analytics ---- */
    function bar(container, data, color){
      container.innerHTML = data.map(d=>`<div style="margin-bottom:9px;"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--mtc-text-1);margin-bottom:4px;"><span>${d.label}</span><span>${d.value}%</span></div><div style="height:7px;background:#170f26;border-radius:6px;overflow:hidden;"><div style="height:100%;width:${d.value}%;background:${color};"></div></div></div>`).join('');
    }
    function renderAnalytics(){
      bar(q('[data-mtc-traffic-chart]'), [{label:'Meta Ads',value:38},{label:'Google Ads',value:26},{label:'Organic',value:20},{label:'Direct',value:11},{label:'Referral',value:5}], 'var(--mtc-grad)');
      bar(q('[data-mtc-device-chart]'), [{label:'Mobile',value:64},{label:'Desktop',value:31},{label:'Tablet',value:5}], 'linear-gradient(90deg,#8a1f4b,#c2477c)');
    }

    /* ---- health ---- */
    function renderHealth(){
      const metaC = state.meta.connected, googleC = state.google.connected;
      const items = [['Meta Connected',metaC],['Pixel Installed',metaC],['Pixel Receiving Events',metaC],['Conversion API',metaC],
        ['GA4 Connected',googleC],['GA4 Receiving Events',googleC],['Google Tag Manager',googleC],['Search Console',googleC],
        ['SSL / HTTPS',true],['Domain Verification',false],['Webhook Status',metaC||googleC],['OAuth Token Valid',metaC||googleC]];
      q('[data-mtc-health-list]').innerHTML = items.map(([label,ok])=>`
        <div class="mtc-health-item"><div class="mtc-left"><span class="mtc-dot ${ok?'mtc-dot-green':'mtc-dot-red'}"></span>${label}</div>
        <span class="mtc-pill ${ok?'mtc-pill-green':'mtc-pill-red'}">${ok?'سليم':'يحتاج انتباه'}</span></div>`).join('');
    }

    /* ---- debug console ---- */
    function pushDebug(method, path, result){
      const el = q('[data-mtc-debug-console]');
      const cls = method==='GET' ? 'mtc-log-get' : (result.indexOf('200')>-1 ? 'mtc-log-post' : 'mtc-log-err');
      const time = new Date().toLocaleTimeString('en-GB',{hour12:false});
      const line = document.createElement('div');
      line.className='mtc-log-line';
      line.innerHTML = `<span class="mtc-log-time">[${time}]</span> <span class="${cls}">${method}</span> ${path} → ${result}`;
      el.prepend(line);
    }
    q('[data-mtc-clear-debug]').addEventListener('click', ()=>{ q('[data-mtc-debug-console]').innerHTML=''; });
    setInterval(()=>{
      const samples = [['GET','/health/meta/pixel','200 OK — 14ms'],['POST','/tracking/event','200 OK — queued'],
        ['GET','/analytics/ga4/status','200 OK'],['POST','/tracking/purchase','200 OK — forwarded'],['GET','/oauth/refresh','200 OK — refreshed']];
      pushDebug(...samples[Math.floor(Math.random()*samples.length)]);
    }, 4500);

    /* ---- test center ---- */
    const testEvents = [{name:'Page View',ic:'📄'},{name:'Lead',ic:'🧲'},{name:'Purchase',ic:'💳'},{name:'Signup',ic:'✍️'},{name:'Login',ic:'🔑'},{name:'Book Meeting',ic:'📅'}];
    function renderTestGrid(){
      q('[data-mtc-test-grid]').innerHTML = testEvents.map((t,i)=>`
        <div class="mtc-test-btn" data-run-test="${i}"><span style="font-size:18px;">${t.ic}</span><b>Test ${t.name}</b>
        <span>يتحقق عبر Meta/GA4/Database</span><div data-test-result="${i}"></div></div>`).join('');
      qa('[data-run-test]').forEach(el=>el.addEventListener('click', ()=>runTest(+el.getAttribute('data-run-test'))));
    }
    function runTest(i){
      const box = q('[data-test-result="'+i+'"]');
      box.innerHTML = `<span class="mtc-test-result" style="background:#eab30822;color:#facc15;">جاري الإرسال...</span>`;
      const slug = testEvents[i].name.toLowerCase().replace(' ','_');
      pushDebug('POST','/test/'+slug,'sending...');
      setTimeout(()=>{
        const ok = Math.random()>0.1;
        box.innerHTML = ok ? `<span class="mtc-test-result" style="background:#22c55e22;color:#4ade80;">✓ وصل بنجاح</span>` : `<span class="mtc-test-result" style="background:#ef444422;color:#f87171;">✗ فشل</span>`;
        pushDebug('POST','/test/'+slug, ok?'200 OK':'500 ERROR — retry queued');
      }, 900);
    }

    /* ---- AI recommendations ---- */
    function renderAI(){
      const recs = [];
      if(!state.meta.connected) recs.push(['⚠️','Meta مش متصل','حملاتك الإعلانية هتفقد بيانات التحويل. اربط Meta الآن.']);
      if(!state.google.connected) recs.push(['⚠️','Google مش متصل','GA4 مهم لتحليل سلوك الزوّار. اربطه دلوقتي.']);
      if(state.meta.connected) recs.push(['🎯','Lead Event ناقص','ضيف Tracking.lead() في صفحة النموذج.']);
      recs.push(['🍪','Cookie Banner مش موجود','Consent Mode مش هيشتغل صح من غيره.']);
      recs.push(['📉','صفحة الحجز من غير تتبّع','ضيف Tracking.bookMeeting() على زرار الحجز.']);
      q('[data-mtc-ai-recs]').innerHTML = recs.map(([ic,title,desc])=>`
        <div class="mtc-ai-rec"><span style="font-size:16px;">${ic}</span><div><b>${title}</b><span>${desc}</span></div>
        <button class="mtc-btn mtc-btn-ghost mtc-ai-fix-btn">إصلاح تلقائي</button></div>`).join('');
    }

    /* ---- init ---- */
    applyAdvancedMode();
    refreshAll();
    renderLibrary();
    renderAnalytics();
    renderTestGrid();
    renderRealtime(true);
    const rtTimer = setInterval(()=>renderRealtime(false), 2500);

    return {
      destroy(){ clearInterval(rtTimer); root.innerHTML=''; },
      getState(){ return JSON.parse(JSON.stringify(state)); }
    };
  }

  window.MarketingTrackingCenter = { mount };

  // Auto-mount if the default container already exists on the page
  document.addEventListener('DOMContentLoaded', function(){
    const el = document.getElementById('mtc-root');
    if(el) mount(el);
  });
  if(document.readyState !== 'loading'){
    const el = document.getElementById('mtc-root');
    if(el) mount(el);
  }
})();
</script>
