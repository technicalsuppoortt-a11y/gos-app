<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
    <meta name="theme-color" content="#7546ff" />
    <script>
      window.addEventListener('beforeinstallprompt', function(event) {
        event.preventDefault(); window.deferredPWAInstallPrompt = event;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
      if ('serviceWorker' in navigator) window.addEventListener('load', function() {
        if (location.protocol === 'https:' || location.hostname === 'localhost') navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    </script>
    <title>gos-app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body dir="ltr">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
